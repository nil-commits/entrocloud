[package]
name = "zerovault-ui-iced"
version = "0.1.0"
edition = "2021"
description = "ZeroVault Status & Settings Native GPU UI (Candidate B1: Pure Rust iced)"

[features]
default = ["gpu-wgpu"]
gpu-wgpu = ["iced/wgpu"]
cpu-tiny-skia = ["iced/tiny-skia"]
hybrid-default = ["iced/wgpu", "iced/tiny-skia", "iced/auto-detect-theme"]

[dependencies]
iced = { version = "0.13", default-features = false, features = [
    "tokio",
    "fira-sans",
    "canvas",
    "advanced",
] }
tokio = { version = "1", features = [
    "net",
    "io-util",
    "rt-multi-thread",
    "sync",
    "time",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
