[workspace]

[package]
name = "cipher_bench"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-lc-rs = { version = "1.19", features = ["prebuilt-nasm"] }
ring = "0.17"
aes-gcm = { version = "0.10", features = ["aes", "alloc", "zeroize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = false
