[package]
name = "entrocloud-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "entrocloud"
path = "src/main.rs"

[[bin]]
name = "entrocloud-tray"
path = "src/bin/entrocloud_tray.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
mimalloc = { workspace = true }
parking_lot = { workspace = true }
png = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tray-icon = { workspace = true }
uuid = { workspace = true }
entrocloud-crypto = { workspace = true, optional = true }
entrocloud-daemon = { workspace = true, optional = true }
entrocloud-types = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
widestring = { workspace = true }
windows = { workspace = true, features = ["Win32_System_Registry"] }
windows-sys = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
tray-icon = { workspace = true, features = ["ksni"] }

[dev-dependencies]
tempfile = { workspace = true }
