[workspace]
resolver = "2"
members = [
    "crates/entrocloud-types",
    "crates/entrocloud-crypto",
    "crates/entrocloud-storage",
    "crates/entrocloud-vfs",
    "crates/entrocloud-core",
    "crates/entrocloud-daemon",
    "crates/entrocloud-cli",
    "crates/entrocloud-ui",
    "tests/e2e",
]
exclude = [
    "benchmarks",
    "target",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/nil-commits/entrocloud"
authors = ["EntroCloud Project"]

[workspace.dependencies]
# Internal workspace crates
entrocloud-types = { path = "crates/entrocloud-types" }
entrocloud-crypto = { path = "crates/entrocloud-crypto" }
entrocloud-storage = { path = "crates/entrocloud-storage" }
entrocloud-vfs = { path = "crates/entrocloud-vfs" }
entrocloud-core = { path = "crates/entrocloud-core" }
entrocloud-daemon = { path = "crates/entrocloud-daemon" }

# Global high-performance allocator (Wave 1 Winner: mimalloc + per-worker mi_collect)
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }

# Async runtime & concurrency
tokio = { version = "1.54", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
bytes = { version = "1.12", features = ["serde"] }
parking_lot = "0.12"
dashmap = "6.2"
lru = "0.19"

# Serialization, identifiers, errors & time
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard = { version = "1.1", default-features = false, features = ["alloc", "use-std"] }
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hex = "0.4"
url = { version = "2.5", features = ["serde"] }

# Hardware-accelerated cryptography & OS secret storage
# Wave 1 Winner: `ring` for 256-bit stitched VAES+VPCLMULQDQ AES-256-GCM bulk crypto;
# `aws-lc-rs` for NIST FIPS 203 ML-KEM-768 + X25519 + Ed25519 post-quantum keyboxes.
ring = "0.17"
aws-lc-rs = { version = "1.19", features = ["prebuilt-nasm"] }
cpufeatures = "0.2"
argon2 = { version = "0.5", features = ["std", "zeroize"] }
hkdf = "0.12"
sha2 = "0.10"
blake3 = "1.8"
subtle = "2.6"
zeroize = { version = "1.9", features = ["derive", "zeroize_derive", "serde"] }
keyring = { version = "3.6", features = [
    "windows-native",
    "async-secret-service",
    "tokio",
    "crypto-rust",
    "linux-native",
] }

# Multi-cloud storage & OAuth2 + PKCE
opendal = { version = "0.59", features = [
    "services-gdrive",
    "services-onedrive",
    "services-dropbox",
    "services-s3",
    "services-webdav",
    "services-fs",
    "services-memory",
    "layers-retry",
    "layers-timeout",
    "layers-concurrent-limit",
] }
oauth2 = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Virtual Filesystem (Windows CfApi & Arch Linux FUSE3)
cloud-filter = "0.0.7"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
widestring = "1.2"
nt-time = "0.15"
flagset = "0.4"
fuser = { version = "0.18", default-features = false }
libc = "0.2"
nix = { version = "0.31", features = ["fs", "user"] }

# Local metadata WAL DB, CLI, logging
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json", "uuid", "blob"] }
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "7.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Zero-WebView Native GPU UI & Tray (Wave 1 Winner: eframe/egui + glow + tray-icon + rfd)
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui = "0.29.1"
egui_extras = "0.29.1"
png = "0.18"
rfd = "0.15.4"
tray-icon = { version = "0.26.1", default-features = false }

# Verification, property-based tamper fuzzing & micro-benchmarks
proptest = "1.12"
criterion = "0.5"
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"
